name: Fail-closed release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase21_disposable_only
          POSTGRES_DB: operatoros_phase21_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operatoros_phase21_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      PARITY_DATABASE_IS_DISPOSABLE: "1"
      OPERATOROS_DETERMINISTIC_PROVIDER_MODE: "1"
      DATABASE_URL: postgresql://postgres:phase21_disposable_only@127.0.0.1:5432/operatoros_phase21_release
      SESSION_SECRET: phase21-disposable-session-secret-only
      SSO_CODE_ENCRYPTION_SECRET: phase21-disposable-sso-encryption-secret-only
      SHARED_SECRET_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_PASSWORD: phase21-disposable-admin-password-only
      APP_ENV: production
      NODE_ENV: production
      OPERATOROS_BASE_URL: https://operatoros.net
      OPERATOROS_APPS_URL: https://app.operatoros.net/
      INTERNAL_API_URL: http://localhost:5001
      OPERATOROS_DATABASE_RELEASE_MODE: apply
      RUNNER_MODE: disabled
      TRUST_PROXY: "true"
      TRADEFLOWKIT_URL: https://tradeflowkit.operatoros.net
      TORQUESHED_URL: https://torqueshed.operatoros.net
      TECHDECK_URL: https://techdeck.operatoros.net
      PULSEDESK_URL: https://pulsedesk.operatoros.net
      FAULTLINELAB_URL: https://faultlinelab.operatoros.net
      OPERATOR_POOL_HALL_URL: https://operatorpoolhall.operatoros.net
      NINJA_POOL_HALL_URL: https://operatorpoolhall.operatoros.net
      BRANDFORGEOS_URL: https://brandforgeos.operatoros.net
      SNAPPROOFOS_URL: https://snapproofos.operatoros.net
      STUDYFORGE_AI_URL: https://studyforge-ai.operatoros.net
      DEPLOY_OPS_URL: https://deployops.operatoros.net
      NINJA_LAUNCH_KIT_URL: https://deployops.operatoros.net
      CALLCOMMAND_AI_URL: https://callcommand-ai.operatoros.net
      SCRIPT_OPS_URL: https://scriptops.operatoros.net
      NINJAMATION_URL: https://scriptops.operatoros.net
      OUTCALL_URL: https://outcall.operatoros.net
      OPERATOROS_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Activate the pinned package manager
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Use Node.js 20 with immutable pnpm-store caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install the clean checkout
        run: pnpm install --frozen-lockfile

      - name: Install the pinned browser
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Capture the read-only migration plan
        run: |
          mkdir -p build/parity
          pnpm db:plan > build/parity/migration-plan.json

      - name: Execute the fail-closed release contract
        run: pnpm verify:release

      - name: Upload parity reports and release-gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-and-release-gate
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/parity/**
            build/operatoros-release.json

      - name: Upload Playwright reports, screenshots, traces, and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/web/playwright-report/**
            apps/web/test-results/**
            test-results/**
