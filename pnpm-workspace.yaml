packages:
  - "apps/*"
  - "packages/*"
# Replit's provider-owned publish scan invokes its bundled pnpm before the
# checked-in deployment build. Let that process use the provider binary instead
# of recursively self-installing the packageManager version until the container
# exhausts its Node worker-thread limit. Local/CI installs remain exact-version
# enforced by preinstall, and .replit still performs the authoritative frozen
# install with pnpm@10.34.5 before building.
managePackageManagerVersions: false
allowBuilds:
  bufferutil: true
  esbuild: true
auditConfig:
  # Both advisories are mitigated by the reviewed local patch below. Keep the
  # ignore list tied to regression fixtures so a future unpatched resolution
  # cannot silently inherit the exception.
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.14'
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/metro-runtime@57.0.9'
  - '@expo/prebuild-config@57.0.11'
  - '@expo/ui@57.0.10'
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-image-picker@57.0.9
  - expo-router@57.0.12
  - expo-server@57.0.2
  - expo-splash-screen@57.0.6
  - expo@57.0.12
overrides:
  rollup: ">=4.62.2"
  tar: ">=7.5.21"
  flatted: ">=3.4.2"
  picomatch: "4.0.5"
  "@xmldom/xmldom": ">=0.9.10"
  ws: ">=8.21.1"
  vite: "7.3.6"
  "express>router": ">=2.2.0"
  "router>path-to-regexp": ">=8.4.0"
  "recharts>lodash": ">=4.18.0"
  "@fastify/ajv-compiler>fast-uri": ">=3.1.4"
  "ajv>fast-uri": ">=3.1.4"
  "fast-json-stringify>fast-uri": ">=3.1.4"
  "fastify>find-my-way": ">=9.7.0"
  "minimatch>brace-expansion": ">=5.0.8"
  "next>sharp": ">=0.35.0"
  "next>postcss": ">=8.5.18"
  "@vitejs/plugin-react>@babel/core": "7.29.6"
  "express>body-parser": ">=2.3.0"
  "express>qs": ">=6.15.2"
  "tsx>esbuild": ">=0.28.1"
  "vite>esbuild": ">=0.28.1"
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0"
patchedDependencies:
  '@expo/plist@0.8.1': patches/@expo__plist@0.8.1.patch
  'image-size@1.2.1': patches/image-size@1.2.1.patch
